name: QUEST LIFE - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: quest-life-apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate or extract Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          # First: check whether the project is already extracted.
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            # Second: find a ZIP archive in the repository.
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 -type f \
              -iname '*.zip' \
              ! -path '*/.git/*' \
              | head -n 1 || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No Android project or ZIP archive was found."
              echo "Upload the Android project ZIP or its extracted files."
              exit 1
            fi

            echo "Found archive: $ZIP_FILE"

            mkdir -p "$RUNNER_TEMP/questlife-extracted"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/questlife-extracted"

            # Find the actual Android project root.
            SETTINGS_FILE="$(find "$RUNNER_TEMP/questlife-extracted" \
              -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
              | head -n 1 || true)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "::error::The ZIP does not contain a valid Gradle Android project."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::The Android app module was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: false

      - name: Check project configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "Checking Gradle project files..."

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -d app

          echo "Project structure looks valid."

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name '*.apk' \
            | head -n 1 || true)"

          if [ -z "$APK_FILE" ]; then
            echo "::error::Build finished but no APK file was found."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/apk-output/QUEST-LIFE.apk"

          echo "APK successfully generated:"
          ls -lh "$GITHUB_WORKSPACE/apk-output/QUEST-LIFE.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QUEST-LIFE-APK
          path: apk-output/QUEST-LIFE.apk
          if-no-files-found: error
          retention-days: 14
          
