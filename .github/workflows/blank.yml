
name: QUEST LIFE - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: quest-life-apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate or Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="$GITHUB_WORKSPACE"
          PROJECT_DIR=""

          # Check for an already extracted project.
          SETTINGS_FILE="$(find "$WORK_DIR" \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' \
            -not -path '*/.build/*' \
            | head -n 1 || true)"

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          else
            # Find the uploaded ZIP.
            ZIP_FILE="$(find "$WORK_DIR" \
              -maxdepth 3 -type f -iname '*.zip' \
              -not -path '*/.git/*' \
              | head -n 1 || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No ZIP file or extracted Android project found."
              exit 1
            fi

            echo "Found ZIP: $ZIP_FILE"

            EXTRACT_DIR="$WORK_DIR/.build/extracted"
            mkdir -p "$EXTRACT_DIR"

            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            SETTINGS_FILE="$(find "$EXTRACT_DIR" \
              -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
              | head -n 1 || true)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "::error::No Gradle settings file found inside ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Android app Gradle file is missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Validate Android Project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -d app

          echo "Project structure verified."

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          APK_FILE="$(find "$APK_DIR" -type f -name '*.apk' \
            | head -n 1 || true)"

          if [ -z "$APK_FILE" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/apk-output/QUEST-LIFE.apk"

          ls -lh "$GITHUB_WORKSPACE/apk-output/QUEST-LIFE.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QUEST-LIFE-APK
          path: apk-output/QUEST-LIFE.apk
          if-no-files-found: error
          retention-days: 14
          
